<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  // Initialize Pi SDK
  Pi.init({ version: "2.0" });

  async function loginWithPi() {
    try {
      // Request login permissions
      const scopes = ['username', 'payments']; 
      const user = await Pi.authenticate(scopes, onIncompletePayment);

      // Display user info
      document.getElementById("loginStatus").innerText = 
        `Logged in as ${user.username} (Wallet: ${user.wallet_address})`;

    } catch (err) {
      console.error(err);
      document.getElementById("loginStatus").innerText = "Login failed!";
    }
  }

  // Handle incomplete payments (required by Pi SDK)
  function onIncompletePayment(payment) {
    console.log("Incomplete payment:", payment);
  }
</script>

<button onclick="loginWithPi()">Login with Pi</button>
<div id="loginStatus"></div>
